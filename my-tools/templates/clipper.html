{% extends "base.html" %}

{% block title %}Video Clipper{% endblock %}

{% block content %}
<a class="back" href="{{ url_for('home') }}">← All tools</a>
<h1>Video Clipper</h1>
<p class="sub">Split a video into clips at its cuts, or save screenshots every few seconds.</p>

<form id="form">
  <label class="field">What do you want to make?</label>
  <div class="choices">
    <label><input type="radio" name="mode" value="split" checked>
      <span>Split into clips<small>A clip at every cut, plus a clear screenshot of each clip's start</small></span></label>
    <label><input type="radio" name="mode" value="screenshots">
      <span>Screenshots<small>One screenshot every few seconds</small></span></label>
  </div>

  <label class="field" for="video">1. Video</label>
  <div class="row">
    <input id="video" type="text" placeholder="Choose a video on your computer" required>
    <button id="pick-video" class="secondary" type="button">Choose video…</button>
  </div>
  <p id="video-info" class="hint"></p>

  <label class="field" for="interval" id="interval-label">2. Longest clip</label>
  <div class="row">
    <input id="interval" type="number" min="0.1" step="any" value="5" required style="max-width: 120px">
    <span>seconds</span>
  </div>
  <p id="estimate" class="hint"></p>

  <div id="split-only">
    <label class="field">Cut detection</label>
    <div class="choices">
      <label><input type="radio" name="sensitivity" value="low">
        <span>Fewer cuts<small>Only big, obvious changes</small></span></label>
      <label><input type="radio" name="sensitivity" value="normal" checked>
        <span>Normal<small>Good for most videos</small></span></label>
      <label><input type="radio" name="sensitivity" value="high">
        <span>More cuts<small>Also catches subtle ones</small></span></label>
    </div>
  </div>

  <label class="field">3. Screenshot type</label>
  <div class="choices">
    <label><input type="radio" name="format" value="png" checked>
      <span>PNG<small>Best quality (no loss), bigger files</small></span></label>
    <label><input type="radio" name="format" value="jpg">
      <span>JPG<small>Highest JPG quality, smaller files</small></span></label>
  </div>

  <label class="field" for="output">4. Save to</label>
  <div class="row">
    <input id="output" type="text" value="{{ default_output }}" required>
    <button id="pick-output" class="secondary" type="button">Choose folder…</button>
  </div>
  <p id="output-hint" class="hint"></p>

  <button id="start" class="wide" type="submit">Run</button>
</form>

<div id="running" hidden>
  <div class="progress"><div id="bar"></div></div>
</div>
<p id="status" class="status" role="status"></p>
<div class="actions">
  <button id="cancel" class="secondary" type="button" hidden>Cancel</button>
  <button id="open" class="secondary" type="button" hidden>Open folder</button>
</div>
{% endblock %}

{% block script %}
<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), status = $("status");
  let videoSeconds = 0, jobId = null, outputFolder = null;

  // Remember your last choices (only in this computer's browser).
  function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  if (recall("clipper-output")) $("output").value = recall("clipper-output");
  if (recall("clipper-mode")) form.mode.value = recall("clipper-mode");

  const mode = () => form.mode.value;

  function updateMode() {
    const split = mode() === "split";
    $("split-only").hidden = !split;
    $("interval-label").textContent = split ? "2. Longest clip" : "2. Take a screenshot every";
    $("interval").min = split ? "0.5" : "0.1";
    $("output-hint").textContent = split
      ? "A new folder like “My Video - clips” is made inside. It holds every clip with its screenshot: My Video_C01.mp4 + My Video_C01.png, and so on."
      : "A new folder named after the video is made inside, so nothing gets overwritten.";
    remember("clipper-mode", mode());
    updateEstimate();
  }
  form.querySelectorAll("input[name=mode]").forEach((input) => input.addEventListener("change", updateMode));

  function formatTime(seconds) {
    const h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = Math.round(seconds % 60);
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  }

  function updateEstimate() {
    const seconds = parseFloat($("interval").value);
    if (mode() === "split") {
      $("estimate").textContent = "A shot longer than this is split into equal parts (6s with a 5s limit = two 3s clips).";
    } else {
      $("estimate").textContent = videoSeconds && seconds > 0
        ? `That's about ${Math.max(1, Math.ceil(videoSeconds / seconds))} screenshots.` : "";
    }
  }

  async function loadInfo() {
    videoSeconds = 0;
    $("video-info").textContent = "";
    updateEstimate();
    if (!$("video").value.trim()) return;
    try {
      const info = await post("{{ url_for('clipper.info') }}", { video: $("video").value });
      videoSeconds = info.seconds;
      $("video-info").textContent = `${info.width}×${info.height}, ${formatTime(info.seconds)} long`;
    } catch (error) {
      $("video-info").textContent = error.message;
    }
    updateEstimate();
  }

  async function pick(kind, input) {
    show(status, kind === "folder" ? "A folder chooser opened. It may be behind this window."
                                   : "A file chooser opened. It may be behind this window.");
    try {
      const { path } = await post("{{ url_for('clipper.pick') }}", { kind });
      if (path) input.value = path;
      show(status, "");
      if (kind === "video") loadInfo();
    } catch (error) {
      show(status, error.message, "error");
    }
  }

  $("pick-video").onclick = () => pick("video", $("video"));
  $("pick-output").onclick = () => pick("folder", $("output"));
  $("video").addEventListener("change", loadInfo);
  $("interval").addEventListener("input", updateEstimate);
  updateMode();

  function setRunning(running) {
    $("start").disabled = running;
    $("running").hidden = !running;
    $("cancel").hidden = !running;
  }

  async function checkProgress() {
    const response = await fetch("{{ url_for('clipper.status', job_id='JOB') }}".replace("JOB", jobId));
    const job = await response.json();
    $("bar").style.width = Math.round(job.progress * 100) + "%";
    const split = job.mode === "split";

    if (job.state === "running" || job.state === "cancelling") {
      const percent = Math.round(job.progress * 100);
      show(status, split ? `${job.phase} ${percent}%` : `Working… ${percent}% (${job.count} screenshots saved)`);
      setTimeout(checkProgress, 700);
      return;
    }
    setRunning(false);
    $("open").hidden = false;
    if (job.state === "done") {
      show(status, split
        ? `Done! ${job.total} clips, each with its screenshot, saved to ${job.folder}`
        : `Done! ${job.count} screenshots saved to ${job.folder}`, "ok");
    } else if (job.state === "cancelled") {
      show(status, split
        ? "Cancelled. Anything made before stopping is in the folder."
        : `Cancelled. ${job.count} screenshots were saved before stopping.`);
    } else {
      show(status, "Something went wrong: " + job.error, "error");
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    $("open").hidden = true;
    try {
      const answer = await post("{{ url_for('clipper.start') }}", {
        mode: mode(),
        video: $("video").value,
        interval: $("interval").value,
        sensitivity: form.sensitivity.value,
        format: form.format.value,
        output: $("output").value,
      });
      remember("clipper-output", $("output").value);
      jobId = answer.job;
      outputFolder = answer.folder;
      $("bar").style.width = "0";
      setRunning(true);
      show(status, "Starting…");
      checkProgress();
    } catch (error) {
      show(status, error.message, "error");
    }
  });

  $("cancel").onclick = () => post("{{ url_for('clipper.cancel', job_id='JOB') }}".replace("JOB", jobId));
  $("open").onclick = () => post("{{ url_for('clipper.open_output') }}", { folder: outputFolder })
    .catch((error) => show(status, error.message, "error"));
</script>
{% endblock %}
