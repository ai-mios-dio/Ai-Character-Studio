<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Downloader</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2129;
      --muted: #616875;
      --border: #d5d9e0;
      --accent: #3b5bdb;
      --accent-text: #ffffff;
      --error: #c92a2a;
      --ok: #2b8a3e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #1f232a;
        --text: #e9ecef;
        --muted: #a0a7b4;
        --border: #363c47;
        --accent: #5c7cfa;
        --error: #ff8787;
        --ok: #69db7c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    label.field { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="url"] {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    .formats { display: flex; gap: 10px; margin: 18px 0 22px; }
    .formats label {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    .formats label:has(input:checked) { border-color: var(--accent); outline: 1px solid var(--accent); }
    button {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { margin: 16px 0 0; min-height: 1.4em; }
    #status.error { color: var(--error); }
    #status.ok { color: var(--ok); }
    .note { margin-top: 22px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Video Downloader</h1>
    <p class="sub">Paste a link from YouTube, Instagram, TikTok and more.</p>

    <form id="form">
      <label class="field" for="url">Video link</label>
      <input id="url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>

      <div class="formats">
        <label><input type="radio" name="format" value="mp4" checked> MP4 (video)</label>
        <label><input type="radio" name="format" value="mp3"> MP3 (audio only)</label>
      </div>

      <button id="button" type="submit">Download</button>
    </form>

    <p id="status" role="status"></p>

    <p class="note">Only download videos you have the right to save, like your own or ones shared with permission.</p>
  </main>

  <script>
    const form = document.getElementById("form");
    const button = document.getElementById("button");
    const status = document.getElementById("status");

    function show(message, kind) {
      status.textContent = message;
      status.className = kind || "";
    }

    // Reads the file name the server sends back (e.g. "My Video.mp4").
    function fileNameFrom(response) {
      const header = response.headers.get("Content-Disposition") || "";
      const utf8 = header.match(/filename\*=UTF-8''([^;]+)/i);
      if (utf8) return decodeURIComponent(utf8[1]);
      const plain = header.match(/filename="?([^";]+)"?/i);
      return plain ? plain[1] : "download";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      show("Downloading… longer videos can take a minute or two.");

      try {
        const response = await fetch("/download", { method: "POST", body: new FormData(form) });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "Something went wrong.");
        }

        // Hand the file to the browser so it lands in your Downloads folder.
        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileNameFrom(response);
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 10000);

        show("Done! Check your Downloads folder.", "ok");
        form.url.value = "";
      } catch (error) {
        show(error.message, "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
